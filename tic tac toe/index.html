<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* General Reset and Body Style */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #121212;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.8rem;
      color: #00ffcc;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .gameContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(6, 80px);
      gap: 10px;
      margin-bottom: 30px;
    }

    .box {
      width: 80px;
      height: 80px;
      background: #1f1f1f;
      border: 2px solid #00ffcc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    .box:hover {
      background-color: #333;
      transform: scale(1.05);
    }

    .boxtext {
      width: 40px;
      height: 40px;
      position: relative;
    }

    /* Info Text */
    .info {
      font-size: 1.8rem;
      margin-top: 20px;
      color: #00ffcc;
    }

    #reset {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #00ffcc;
      border: none;
      color: #121212;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #reset:hover {
      background-color: #00cc99;
    }

    .imgbox {
      margin-top: 30px;
      display: none;
    }

    .imgbox img {
      width: 200px;
      height: auto;
    }

    .logo-section {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 15px;
      background-color: #1f1f1f;
      padding: 10px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.5);
    }

    .logo-icon {
      font-size: 2.5rem;
      color: #00ffcc;
    }

    .logo-text {
      font-size: 2rem;
      font-weight: bold;
      color: #00ffcc;
      letter-spacing: 2px;
      font-family: 'Courier New', Courier, monospace;
    }
  </style>
</head>
<body>

  <h1 class="main-heading">6x6 Tic Tac Toe</h1>

  <div class="gameContainer">

    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-box">
        <span class="logo-icon">❌⭕</span>
        <span class="logo-text">Tic Tac Toe</span>
      </div>
    </div>

    <!-- Grid Container -->
    <div class="container">
      <!-- 36 Boxes -->
      <!-- You can generate this using a loop in JS too -->
      <!-- Each box has a .box div and an empty .boxtext span -->
      <!-- Repeating manually here as requested -->
      <!-- Start: -->
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>

      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>

      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>

      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>

      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>

      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <!-- End: 36 Boxes -->
    </div>

    <!-- Turn info and Reset -->
    <div class="info">Turn for X</div>
    <button id="reset">Reset Game</button>

    <!-- Winner animation -->
    <div class="imgbox">
      <img src="excited.gif" alt="Winner Animation" />
    </div>
  </div>

  <!-- External Script -->
  <script src="script.js"></script>
</body>
</html>
